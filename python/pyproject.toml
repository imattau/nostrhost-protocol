[project]
name = "nostrhost-protocol"
version = "0.1.0"
description = "Cross-language NostrHost control-plane event protocol (Python binding): kind constants, validation, folding, conformance corpus"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nostrhost_protocol"]